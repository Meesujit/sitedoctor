<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>sitedoctor</title>
<style>
  :root {
    --bg: #f7f7f8;
    --surface: #ffffff;
    --border: #e4e4e7;
    --text: #18181b;
    --text-muted: #6b7280;
    --text-faint: #9ca3af;
    --critical: #dc2626;
    --critical-bg: #fef2f2;
    --warning: #b45309;
    --warning-bg: #fffbeb;
    --info: #2563eb;
    --info-bg: #eff6ff;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  /* Dark values apply when the OS prefers dark (and the user hasn't
     explicitly picked light), OR when the user has explicitly picked
     dark regardless of OS preference. The toggle button below sets
     data-theme and remembers it in localStorage. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0b0d;
      --surface: #17171a;
      --border: #2a2a2e;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --text-faint: #71717a;
      --critical: #f87171;
      --critical-bg: #2a1414;
      --warning: #fbbf24;
      --warning-bg: #2a2211;
      --info: #60a5fa;
      --info-bg: #12213a;
      --accent: #818cf8;
      --accent-hover: #a5b4fc;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0b0d;
    --surface: #17171a;
    --border: #2a2a2e;
    --text: #f4f4f5;
    --text-muted: #a1a1aa;
    --text-faint: #71717a;
    --critical: #f87171;
    --critical-bg: #2a1414;
    --warning: #fbbf24;
    --warning-bg: #2a2211;
    --info: #60a5fa;
    --info-bg: #12213a;
    --accent: #818cf8;
    --accent-hover: #a5b4fc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  main {
    max-width: 780px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .tagline {
    color: var(--text-muted);
    font-size: 14px;
    margin: 0;
  }
  .header-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 28px;
  }
  #theme-toggle {
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 15px;
    line-height: 1;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  #theme-toggle:hover { background: var(--bg); }
  form {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  input[type="text"] {
    flex: 1;
    min-width: 0;
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
  }
  input[type="text"]:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }
  button {
    padding: 11px 18px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.6; cursor: default; }

  details.options {
    margin-bottom: 28px;
  }
  details.options summary {
    font-size: 13px;
    color: var(--text-muted);
    cursor: pointer;
    user-select: none;
  }
  .opt-row {
    display: flex;
    gap: 16px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .opt-row label {
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .opt-row input[type="number"] {
    width: 72px;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
  }

  #status {
    color: var(--text-muted);
    font-size: 13px;
    margin: 12px 0;
    min-height: 18px;
  }

  #score-card {
    display: none;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    padding: 18px 20px;
    margin: 24px 0 14px;
    align-items: center;
    gap: 18px;
  }
  #score-card.show { display: flex; }
  #score-num { font-size: 40px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
  #score-num.healthy { color: #16a34a; }
  #score-num.attention { color: var(--warning); }
  #score-num.risk, #score-num.critical-score { color: var(--critical); }
  #score-meta { flex: 1; min-width: 0; }
  #score-label { font-size: 14px; font-weight: 600; }
  #score-delta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  #score-delta.up { color: #16a34a; }
  #score-delta.down { color: var(--critical); }
  #sparkline { flex-shrink: 0; }
  #download-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    font-weight: 500;
    padding: 8px 14px;
    font-size: 13px;
  }
  #download-btn:hover { background: var(--bg); }

  #summary {
    display: none;
    gap: 10px;
    margin: 0 0 24px;
  }
  #summary.show { display: flex; }
  .stat {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    background: var(--surface);
  }
  .stat .n { font-size: 24px; font-weight: 700; line-height: 1; }
  .stat .label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .stat.critical .n { color: var(--critical); }
  .stat.warning .n { color: var(--warning); }
  .stat.info .n { color: var(--info); }

  .why-it-matters {
    font-size: 13px;
    color: var(--text-muted);
    margin: -2px 0 10px;
    line-height: 1.5;
  }
  details.tech {
    margin-top: 6px;
  }
  details.tech summary {
    font-size: 12px;
    color: var(--text-faint);
    cursor: pointer;
    user-select: none;
  }

  #meta {
    font-size: 12px;
    color: var(--text-faint);
    margin-bottom: 8px;
  }

  .notes {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 16px;
  }
  .notes div { margin-bottom: 2px; }

  .group {
    margin-bottom: 22px;
  }
  .group h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    margin: 0 0 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .finding {
    display: flex;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .finding:last-child { border-bottom: none; }
  .badge {
    flex-shrink: 0;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.03em;
    padding: 3px 7px;
    border-radius: 5px;
    height: fit-content;
    white-space: nowrap;
  }
  .badge.critical { color: var(--critical); background: var(--critical-bg); }
  .badge.warning { color: var(--warning); background: var(--warning-bg); }
  .badge.info { color: var(--info); background: var(--info-bg); }
  .finding-body { min-width: 0; }
  .finding-msg { font-size: 14px; }
  .finding-url, .finding-detail {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-faint);
    margin-top: 3px;
    word-break: break-all;
  }

  #empty {
    display: none;
    text-align: center;
    padding: 40px 0;
    color: var(--text-muted);
  }
  #empty.show { display: block; }

  #error {
    display: none;
    background: var(--critical-bg);
    color: var(--critical);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13px;
    margin: 16px 0;
  }
  #error.show { display: block; }
</style>
<script>
  // Applied before paint so there's no flash of the wrong theme on load.
  try {
    var saved = localStorage.getItem("sitedoctor-theme");
    if (saved === "light" || saved === "dark") {
      document.documentElement.setAttribute("data-theme", saved);
    }
  } catch (e) {}
</script>
</head>
<body>
<main>
  <div class="header-row">
    <div>
      <h1>sitedoctor</h1>
      <p class="tagline">Catches the site-health bugs a single-pass SEO crawler misses.</p>
    </div>
    <button id="theme-toggle" type="button" title="Toggle light/dark" aria-label="Toggle light/dark theme">🌙</button>
  </div>

  <form id="scan-form">
    <input type="text" id="domain" placeholder="example.com" autocomplete="off" autofocus />
    <button type="submit" id="scan-btn">Scan</button>
  </form>

  <details class="options">
    <summary>Options</summary>
    <div class="opt-row">
      <label>Page limit
        <input type="number" id="opt-limit" value="40" min="1" max="500" />
      </label>
      <label>Redirect samples
        <input type="number" id="opt-redirect" value="4" min="1" max="20" />
      </label>
      <label>Sitemap fetch attempts
        <input type="number" id="opt-sitemap" value="5" min="1" max="10" />
      </label>
    </div>
  </details>

  <div id="status"></div>
  <div id="error"></div>

  <div id="score-card">
    <div id="score-num">–</div>
    <div id="score-meta">
      <div id="score-label"></div>
      <div id="score-delta"></div>
    </div>
    <div id="sparkline"></div>
    <button id="download-btn" type="button">Download report</button>
  </div>

  <div id="summary">
    <div class="stat critical"><div class="n" id="n-critical">0</div><div class="label">Critical</div></div>
    <div class="stat warning"><div class="n" id="n-warning">0</div><div class="label">Warning</div></div>
    <div class="stat info"><div class="n" id="n-info">0</div><div class="label">Info</div></div>
  </div>

  <div id="meta"></div>
  <div class="notes" id="notes"></div>
  <div id="empty">No issues found. 🎉</div>
  <div id="results"></div>
</main>

<script>
  const form = document.getElementById("scan-form");
  const domainInput = document.getElementById("domain");
  const scanBtn = document.getElementById("scan-btn");
  const statusEl = document.getElementById("status");
  const errorEl = document.getElementById("error");
  const scoreCardEl = document.getElementById("score-card");
  const summaryEl = document.getElementById("summary");
  const metaEl = document.getElementById("meta");
  const notesEl = document.getElementById("notes");
  const emptyEl = document.getElementById("empty");
  const resultsEl = document.getElementById("results");
  const downloadBtn = document.getElementById("download-btn");

  const SEVERITY_ORDER = ["critical", "warning", "info"];
  let lastData = null;

  const themeToggle = document.getElementById("theme-toggle");
  const THEME_KEY = "sitedoctor-theme";

  function effectiveTheme() {
    const explicit = document.documentElement.getAttribute("data-theme");
    if (explicit) return explicit;
    return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }

  function syncThemeIcon() {
    // Icon shows what clicking it switches TO.
    themeToggle.textContent = effectiveTheme() === "dark" ? "☀️" : "🌙";
  }

  themeToggle.addEventListener("click", () => {
    const next = effectiveTheme() === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try {
      localStorage.setItem(THEME_KEY, next);
    } catch (e) {}
    syncThemeIcon();
  });

  syncThemeIcon();

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  function scoreClass(score) {
    if (score >= 90) return "healthy";
    if (score >= 70) return "attention";
    if (score >= 40) return "risk";
    return "critical-score";
  }

  function sparklineSvg(history) {
    const scores = history.map((h) => h.healthScore);
    if (scores.length < 2) return "";
    const w = 100, h = 32, pad = 3;
    const min = Math.min(...scores), max = Math.max(...scores);
    const range = max - min || 1;
    const pts = scores.map((s, i) => {
      const x = pad + (i / (scores.length - 1)) * (w - pad * 2);
      const y = h - pad - ((s - min) / range) * (h - pad * 2);
      return [x, y];
    });
    const path = pts.map((p, i) => `${i === 0 ? "M" : "L"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
    const last = pts[pts.length - 1];
    const color = "var(--accent)";
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
      <path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.5" fill="${color}" />
    </svg>`;
  }

  function findingsHtml(findings) {
    const sorted = [...findings].sort(
      (a, b) => SEVERITY_ORDER.indexOf(a.severity) - SEVERITY_ORDER.indexOf(b.severity)
    );
    return sorted
      .map(
        (f) => `
        <div class="finding">
          <span class="badge ${f.severity}">${f.severity}</span>
          <div class="finding-body">
            <div class="finding-msg">${esc(f.message)}</div>
            ${f.url ? `<div class="finding-url">${esc(f.url)}</div>` : ""}
            ${f.detail ? `<div class="finding-detail">${esc(f.detail)}</div>` : ""}
          </div>
        </div>`
      )
      .join("");
  }

  function render(data) {
    lastData = data;

    scoreCardEl.classList.add("show");
    const scoreNumEl = document.getElementById("score-num");
    scoreNumEl.textContent = data.healthScore;
    scoreNumEl.className = scoreClass(data.healthScore);
    document.getElementById("score-label").textContent = `${data.healthScoreLabel} — ${data.pagesScanned} page(s) scanned`;
    const deltaEl = document.getElementById("score-delta");
    if (data.healthScoreDelta === null) {
      deltaEl.textContent = "First scan of this site";
      deltaEl.className = "";
    } else if (data.healthScoreDelta === 0) {
      deltaEl.textContent = "No change since last scan";
      deltaEl.className = "";
    } else {
      const up = data.healthScoreDelta > 0;
      deltaEl.textContent = `${up ? "+" : ""}${data.healthScoreDelta} since last scan`;
      deltaEl.className = up ? "up" : "down";
    }
    document.getElementById("sparkline").innerHTML = sparklineSvg(data.history || []);

    summaryEl.classList.add("show");
    document.getElementById("n-critical").textContent = data.summary.critical;
    document.getElementById("n-warning").textContent = data.summary.warning;
    document.getElementById("n-info").textContent = data.summary.info;

    metaEl.textContent = `${data.target} — scanned ${new Date(data.generatedAt).toLocaleString()}`;

    notesEl.innerHTML = (data.warnings || [])
      .map((w) => `<div>note: ${esc(w)}</div>`)
      .join("");

    resultsEl.innerHTML = "";
    if (data.findings.length === 0) {
      emptyEl.classList.add("show");
      return;
    }
    emptyEl.classList.remove("show");

    for (const g of data.groups) {
      const group = document.createElement("div");
      group.className = "group";
      group.innerHTML = `
        <h2>${esc(g.title)}</h2>
        ${g.whyItMatters ? `<div class="why-it-matters">${esc(g.whyItMatters)}</div>` : ""}
        <details class="tech">
          <summary>Technical details (${g.findings.length})</summary>
          ${findingsHtml(g.findings)}
        </details>`;
      resultsEl.appendChild(group);
    }
  }

  function buildShareableReport(data) {
    const groupsHtml = data.groups
      .map(
        (g) => `
        <section class="grp">
          <h2>${esc(g.title)} (${g.findings.length})</h2>
          <p class="why">${esc(g.whyItMatters)}</p>
          ${g.findings
            .map(
              (f) => `
            <div class="f">
              <strong class="sev ${f.severity}">${f.severity}</strong>
              <div class="msg">${esc(f.message)}</div>
              ${f.url ? `<div class="u">${esc(f.url)}</div>` : ""}
            </div>`
            )
            .join("")}
        </section>`
      )
      .join("");

    // Self-contained: a real dark/light toggle for a file that gets opened
    // standalone, outside the app — no dependency on the app's own state.
    return `<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Site health report — ${esc(data.target)}</title>
<style>
  :root {
    --bg: #f7f7f8; --surface: #ffffff; --border: #e4e4e7;
    --text: #18181b; --text-muted: #6b7280; --text-faint: #9ca3af;
    --critical: #dc2626; --warning: #b45309; --info: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0b0d; --surface: #17171a; --border: #2a2a2e;
      --text: #f4f4f5; --text-muted: #a1a1aa; --text-faint: #71717a;
      --critical: #f87171; --warning: #fbbf24; --info: #60a5fa;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0b0d; --surface: #17171a; --border: #2a2a2e;
    --text: #f4f4f5; --text-muted: #a1a1aa; --text-faint: #71717a;
    --critical: #f87171; --warning: #fbbf24; --info: #60a5fa;
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px 60px; color: var(--text); background: var(--bg); }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  h1 { font-size: 22px; margin: 0 0 2px; }
  .meta { color: var(--text-muted); font-size: 14px; margin-top: 0; }
  #toggle { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 7px 10px; cursor: pointer; font-size: 14px; }
  .score { font-size: 44px; font-weight: 800; margin: 20px 0 2px; }
  .score span { font-size: 16px; color: var(--text-faint); font-weight: 400; }
  .summary-line { font-size: 14px; color: var(--text-muted); margin-bottom: 24px; }
  .grp { margin-bottom: 28px; }
  .grp h2 { font-size: 16px; margin: 0 0 6px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  .why { color: var(--text-muted); font-size: 14px; margin: 0 0 12px; }
  .f { padding: 8px 0; border-bottom: 1px solid var(--border); }
  .sev { text-transform: uppercase; font-size: 11px; }
  .sev.critical { color: var(--critical); }
  .sev.warning { color: var(--warning); }
  .sev.info { color: var(--info); }
  .msg { font-size: 14px; margin-top: 2px; }
  .u { font-family: monospace; font-size: 12px; color: var(--text-faint); margin-top: 2px; word-break: break-all; }
  @media print { #toggle { display: none; } }
</style>
<script>
  try {
    var saved = localStorage.getItem("sitedoctor-theme");
    if (saved === "light" || saved === "dark") document.documentElement.setAttribute("data-theme", saved);
  } catch (e) {}
<\/script>
</head>
<body>
  <div class="top">
    <div>
      <h1>Site health report</h1>
      <p class="meta">${esc(data.target)} — generated ${new Date(data.generatedAt).toLocaleString()}</p>
    </div>
    <button id="toggle" type="button" aria-label="Toggle light/dark">🌙</button>
  </div>
  <div class="score">${data.healthScore}<span>/100</span></div>
  <div class="summary-line">${esc(data.healthScoreLabel)} — ${data.summary.critical} critical, ${data.summary.warning} warning, ${data.summary.info} info</div>
  ${data.findings.length === 0 ? "<p>No issues found.</p>" : groupsHtml}
  <script>
    var btn = document.getElementById("toggle");
    function effective() {
      var explicit = document.documentElement.getAttribute("data-theme");
      if (explicit) return explicit;
      return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    function sync() { btn.textContent = effective() === "dark" ? "☀️" : "🌙"; }
    btn.addEventListener("click", function () {
      var next = effective() === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("sitedoctor-theme", next); } catch (e) {}
      sync();
    });
    sync();
  <\/script>
</body>
</html>`;
  }

  downloadBtn.addEventListener("click", () => {
    if (!lastData) return;
    const html = buildShareableReport(lastData);
    const blob = new Blob([html], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const safeName = lastData.target.replace(/^https?:\/\//, "").replace(/[^a-z0-9.-]/gi, "_");
    a.href = url;
    a.download = `sitedoctor-report-${safeName}-${new Date().toISOString().slice(0, 10)}.html`;
    a.click();
    URL.revokeObjectURL(url);
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const domain = domainInput.value.trim();
    if (!domain) return;

    scanBtn.disabled = true;
    errorEl.classList.remove("show");
    summaryEl.classList.remove("show");
    emptyEl.classList.remove("show");
    resultsEl.innerHTML = "";
    metaEl.textContent = "";
    notesEl.innerHTML = "";
    statusEl.textContent = "Scanning — this takes a bit, it's making real requests to the site...";

    try {
      const res = await fetch("/api/scan", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          domain,
          limit: Number(document.getElementById("opt-limit").value) || undefined,
          redirectSamples: Number(document.getElementById("opt-redirect").value) || undefined,
          sitemapAttempts: Number(document.getElementById("opt-sitemap").value) || undefined,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      statusEl.textContent = "";
      render(data);
    } catch (err) {
      statusEl.textContent = "";
      errorEl.textContent = err.message || String(err);
      errorEl.classList.add("show");
    } finally {
      scanBtn.disabled = false;
    }
  });
</script>
</body>
</html>
